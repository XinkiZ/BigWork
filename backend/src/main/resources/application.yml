# ============================================================
#  Wylie College 学生选课注册系统 —— 后端配置
#  修改口令时只需调整本文件中的 username / password 两处
# ============================================================
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: course-registration
  datasource:
    # 主业务库（读写）
    url: jdbc:mysql://localhost:3306/bigwork?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true
    username: bigwork_app
    password: bigwork123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: bigwork-pool
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none          # 表结构由 db/init.sql 建立
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always

# JWT 认证（HS256，密钥长度需 >= 32 字节）
jwt:
  secret: wylie-college-course-registration-jwt-secret-key-2026-please-change-me-0123456789
  expire-minutes: 720

# 遗留课程目录库（DEC VAX / Ingres 迁移模拟库），只读账号
legacy:
  mode: cached            # direct=直连（约 8 秒）；cached=经中间层缓存（毫秒级）
  available: true         # false 时模拟"课程目录不可用"，用例终止
  simulated-latency-ms: 8000   # 模拟遗留系统单次全量读取耗时（题目要求 <=10 秒）
  cache-ttl-seconds: 600       # 中间层缓存有效期：10 分钟
  db:
    url: jdbc:mysql://localhost:3306/legacy_catalog?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true
    username: legacy_ro
    password: legacy_ro123

# 计费系统（本地模拟服务）
billing:
  available: true              # false 时账单发送失败并按周期重试
  retry-interval-seconds: 30   # 失败重试周期（秒）

# 学费单价（元/学分）
tuition:
  per-credit: 500

logging:
  level:
    root: INFO
    com.wylie.registration: INFO
    org.hibernate.SQL: WARN